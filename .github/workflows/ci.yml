name: CI

# Все ветки, а не только master. Работа в ветке иначе не проверяется вовсе:
# о поломке типов или упавшей проверке человек узнаёт уже после слияния, когда
# чинить дороже. Прогон стоит минуты, слияние сломанного — часы.
on:
  push:
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Именно `npm ci`, а не `npm install`: он ставит ровно то, что записано в
      # package-lock.json, и падает при расхождении. `npm install` подтягивает
      # обновления по диапазонам версий — тогда проверенное в сборке дерево
      # зависимостей и собранное позже приложение оказываются разными.
      #
      # legacy-peer-deps брать флагом не нужно: он объявлен в .npmrc проекта.
      - run: npm ci

      # Каждый шаг идёт через обёртку. Причина: журнал GitHub Actions виден
      # только после входа в учётную запись, и снаружи упавший прогон выглядит
      # как «Process completed with exit code 1» без единой подробности.
      # Обёртка выносит причину падения в пометки (::error::), а они видны всем.
      - name: Типы
        run: bash scripts/ci-run.sh "Типы" npm run typecheck

      - name: Линтер
        run: bash scripts/ci-run.sh "Линтер" npm run lint

      - name: Проверки
        run: bash scripts/ci-run.sh "Проверки" npx jest --ci

      # Разбор app.json с раскрытием плагинов Expo. Ловит то, чего не видят ни
      # типы, ни линтер: сломанную настройку плагина, опечатку в разрешениях,
      # несуществующий плагин — то есть поломки, которые иначе всплывают только
      # в момент сборки приложения, спустя минуты ожидания.
      #
      # Работает без сети и без входа в учётную запись Expo — проверено.
      - name: Разбор app.json
        run: bash scripts/ci-run.sh "Разбор app.json" npx expo config --type public

# ── Чего здесь намеренно нет ─────────────────────────────────────────────────
#
# expo-doctor. Он сверяет версии пакетов с требуемыми для SDK и на первый взгляд
# просится в сборку, но ставить его нельзя по трём причинам:
#
#   1. Без доступа к api.expo.dev он молча рапортует «18/18 checks passed» и
#      выходит с нулём. Проверено: с закрытой сетью прогон зелёный, хотя на
#      деле два пакета разошлись на мажорную версию. Проверка, которая врёт в
#      зелёную сторону, хуже отсутствующей — на неё полагаются.
#   2. Он сверяется с последними патчами SDK по сети. Expo выпускает патч —
#      сборка краснеет, хотя в коде не менялось ничего.
#   3. Сейчас он и так красный: netinfo и jest-expo стоят новее, чем ждёт
#      SDK 54, и это, судя по всему, сделано намеренно. Выравнивать их — не
#      задача сборки, это отдельное решение.
#
# eas build. Требует входа в учётную запись Expo: в eas.json указан
# appVersionSource "remote" и autoIncrement, а в app.json — владелец проекта.
# Сборка идёт на серверах Expo и берёт оттуда же ключи подписи. Для сборки в
# CI нужен секрет EXPO_TOKEN; пока его нет, шаг был бы гарантированно красным.
